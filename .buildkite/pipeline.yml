# Entire mirror integration. Checks/build are real; release stages remain simulated.
# Hosted Linux agents need Node 22, npm, and a working Docker daemon.
# Each feature shard starts its own disposable PostgreSQL 17 container.
steps:
  - label: ":git: Verify checkout"
    key: checkout
    command:
      - git rev-parse --verify HEAD
      - test -f .buildkite/pipeline.yml
      - node --version
    timeout_in_minutes: 2

  - label: ":mag: Lint and typecheck"
    key: quality
    depends_on: checkout
    command:
      - npm ci
      - npm run lint
      - npm run typecheck
    timeout_in_minutes: 10

  - label: ":test_tube: Unit specs %n / %t"
    key: unit
    depends_on: checkout
    parallelism: 2
    command:
      - npm ci
      # Buildkite indices are zero-based; defer expansion until the job runs.
      - npm run test:unit -- --shard=$$((BUILDKITE_PARALLEL_JOB + 1))/$$BUILDKITE_PARALLEL_JOB_COUNT
    timeout_in_minutes: 10

  - label: ":globe_with_meridians: Feature specs %n / %t"
    key: feature
    depends_on: checkout
    parallelism: 2
    command:
      - npm ci
      - npx playwright install --with-deps chromium
      - bash .buildkite/test-feature.sh
    artifact_paths:
      - playwright-report/**/*
      - test-results/**/*
    timeout_in_minutes: 20

  - label: ":hammer: Build application"
    key: build
    depends_on:
      - quality
      - unit
      - feature
    command:
      - npm ci
      - npm run build
    timeout_in_minutes: 15

  - label: ":package: Package application (mock)"
    key: package
    depends_on: build
    command: 'echo "MOCK ONLY: would package this commit; nothing is published"'
    timeout_in_minutes: 2

  - label: ":rocket: Deploy staging (mock)"
    key: staging
    depends_on: package
    command: 'echo "MOCK ONLY: would deploy to staging; no deployment occurs"'
    timeout_in_minutes: 2

  - label: ":fire: Staging smoke checks (mock)"
    key: smoke
    depends_on: staging
    command: 'echo "MOCK ONLY: would check staging health and login; no smoke tests run"'
    timeout_in_minutes: 2

  - block: ":lock: Approve production (mock)"
    key: approve-production
    depends_on: smoke
    branches: master
    prompt: "Demo gate only. Continuing prints a message and does not deploy."

  - label: ":rocket: Deploy production (mock)"
    key: production
    depends_on: approve-production
    branches: master
    command: 'echo "MOCK ONLY: would deploy the approved release; no deployment occurs"'
    timeout_in_minutes: 2
