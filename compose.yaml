services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: athleta
      POSTGRES_PASSWORD: athleta
      POSTGRES_DB: athleta
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athleta -d athleta"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
